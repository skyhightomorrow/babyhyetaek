name: daily-guide-publish

# 매일 06:30 KST(21:30 UTC 전일) — 예약된 가이드 date-gate 발행.
# 다른 사이트 수집 크론과 20분 이상 어긋나게(무료 빌드 동시성 1).
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 어느 스텝이든 매달리면 강제 종료(C naebaeka 2026-07-13 무한대기 사고 교훈)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # proj4(산후조리원 좌표 변환) 설치 — 페이지 빌드 자체는 의존성이 없다
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # 산후조리원 공공데이터 갱신 (2026-09-13). 키가 필요 없는 공개 파일이다.
      # ⚠️ 실패해도 워크플로를 멈추지 않는다 — 스크립트가 결손·오류 시 data/postpartum.json을 건드리지 않고 exit 1 하므로,
      #    여기서는 경고만 남기고 기존 데이터로 계속 빌드한다(가이드 예약발행이 이 단계 때문에 막히면 안 된다).
      - name: Refresh postpartum centers (keeps existing data on failure)
        run: |
          timeout 180 node scripts/fetch-postpartum.js || echo "::warning::산후조리원 데이터 갱신 실패 — 기존 data/postpartum.json 으로 빌드"
      # 복지로 지자체 지원사업 갱신 (2026-09-13) — 저장소 secret DATA_GO_KR_KEY가 있을 때만.
      # 전에는 수동 갱신뿐이라 전남광주가 55일간 옛 데이터로 나갔다(build-local.js 주석). --incremental은 커밋된
      # benefits.json을 출발점으로 새·수정 항목만 받고(일 한도 1,000), 실패·급감 시 파일을 건드리지 않는다.
      - name: Refresh local benefits (skips without secret, keeps existing data on failure)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "::notice::DATA_GO_KR_KEY secret 없음 — 지원사업 갱신 건너뜀"; exit 0; fi
          timeout 900 node scripts/fetch-benefits.js --incremental --limit 400 || echo "::warning::지원사업 갱신 실패 — 기존 data/benefits.json 으로 빌드"
      - name: Build pages + guides (date-gated · pages first so guide sitemap merges)
        run: |
          node scripts/build-local.js
          node scripts/build-pages.js
          node scripts/build-guides.js
          node scripts/stamp-assets.js
        env:
          SITE_ORIGIN: https://babyhyetaek.com
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 발행할 예약 글 없음"
          else
            git commit -m "chore: 가이드 예약발행 (자동)"
            git push
          fi
